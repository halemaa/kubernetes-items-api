# secret.yaml
# A Secret for the API token. IMPORTANT, and stated honestly:
# `stringData` lets you write the plain value here for convenience, but once in
# the cluster a Secret is only BASE64-ENCODED, NOT ENCRYPTED. Anyone who can
# read Secrets in this namespace can decode it. This value is a DEMO token, safe
# to be public. In production you would NOT commit a real Secret to git — you'd
# use Sealed Secrets / an external vault and encrypt etcd at rest.
apiVersion: v1
kind: Secret
metadata:
  name: items-api-secret
  namespace: items-api
type: Opaque
stringData:
  API_TOKEN: "demo-token-not-a-real-secret"
